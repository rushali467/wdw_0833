<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSIGNMENT 18</title>

    <style>
    
    header {
        background-color: rgb(19, 19, 87);
        color: white;
        text-align: center;
        margin:0 auto;
        width: 65%;
        padding: 20px;
    }

    table{
        width: 50%;
        margin:20px auto;
        border-collapse: collapse;
    }

    h1 {
        margin: 5px;
    }

    h2{
        margin-left: 25%;

    }

    caption{
        padding: 5px;
    }

    th,td{
        border: 1px solid;
        padding:5px;
        text-align: left;
    }

    th{
        background-color: rgb(183, 193, 199);
        text-align: center;
    }

    fieldset{
        width:50%;
        padding: 10px;
        margin: auto;
    }

    footer{
        background-color: rgb(19, 19, 87);
        color: white;
        text-align: center;
        width: 65%;
        padding: 10px;
        margin:auto;
    }


    </style>

</head>


<body>

    <header>
        <h1> ABC College Admission</h1>
    </header>

        <h2>Courses and Fees </h2>

        <table align= "center" border="1" cellspacing="0" cellpadding ="5" width = "65%" height = "98%" >
            <caption><b>Available Courses</b></caption>

            <tr>
                <th>Course</th>
                <th>Seats</th>
                <th>Fees</th>
            </tr>

            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>&#8377;90,000</td>
            </tr>  

            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>&#8377;45,000</td>
            </tr>


        </table>

        <form>

            <fieldset>

                <legend>Application Form</legend>

                <label for = "fullname">NAME:</label>
                <input type = "text" id = "fullname" name="fullname" required>
                <br><br>

                <label for = "email">EMAIL:</label>
                <input type = "email" id = "email" name="email" required>
                <br><br>

                <label for = "course">COURSE:</label>
                    <select id="course" name="course">
                        <option selected>B.Tech CSE</option>
                        <option>BCA</option>
                    </select>
                    <br><br>

                <label for = "statement">STATEMENT:</label><br>
                <textarea id = "statement" name="statement" rows="7" cols="40"></textarea>
                <br><br>

                <button 
                    type="submit">Apply
                </button>

            </fieldset>
            </form>

            <br>
            <br>

            <footer align="center">
                &copy; 2026 ABC College
            </footer>

    </body>
</html>
