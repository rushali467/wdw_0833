<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSIGNMENT 17</title>
</head>
<body>
    <form action="#" method ="post">

            <input type = "text" name="fullname" placeholder="Full Name" required="Please fill out this field">
            <br><br>

            <input type = "email" name="email" placeholder="you@college.edu" required="Please include an '@' in the email address">
            <br><br>

            <input type = "digit" name="mobile" placeholder="10-digit mobile" required="Enter exactly 10 digits">
            <br><br>

            <input type = "password" name="password" placeholder="password" required="Minimum 6 characters">
            <br><br>

            <input type="number" name="age" placeholder="Age (17-30)"
            min="17" max="30" required>
            <br><br>

            <button type="submit">Register</button>

        </form>
    </body>
