<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSIGNMENT 17</title>
</head>
<body>
    <form action="#" method ="post">

            <input type = "alphabets" name="fullname" title="Enter Full Name" placeholder="Full Name" required>
            <br><br>

            <input type = "email" name="email" title="Please include an '@' in the email address" placeholder="you@college.edu" required>
            <br><br>

            <input type = "tel" name="mobile" pattern="[0-9]{10}" maxlength="10" title="Enter exactly 10 digits" placeholder="10-digit mobile" required>
            
            <br><br>

            <input type = "password" name="password" placeholder="password" minlength="6" maxlength="15" title="Enter Atleast 6 characters" required>
            <br><br>

            <input type="number" name="age" placeholder="Age (17-30)"
            min="17" max="30" title="Value must be less than or equal to 30" required>
            <br><br>

            <button type="submit">Register</button>

        </form>
    </body>
</html>
